<title>Cold Start</title>

<style>
  /* ------------------------------------------------------------------
     COLD START — CRT entrance animation prototype

     One canvas, one grid of chunky cells. The same pixels that scramble
     as television snow settle into the words. Nothing is ever swapped
     for a text layer.

     Tuning lives in the CONFIG block at the top of the <script> below.
     ------------------------------------------------------------------ */

  /* --- Placeholder homepage tokens (theme-aware, 3-state) ----------- */
  :root {
    --page-bg:    #ebedec;
    --page-fg:    #1b1e1d;
    --page-muted: #6e7573;
    --page-rule:  rgba(27, 30, 29, 0.14);

    /* --- Intro world: deliberately committed, never theme-flipped --- */
    --crt-void:   #161918;
    --crt-haze:   #1f2422;
    --crt-screen: #0b0d0c;
    --crt-frame:  rgba(163, 186, 173, 0.62);
    --crt-glow:   rgba(150, 180, 165, 0.24);

    /* --- Control rig: self-contained dark pill, works on any ground -- */
    --rig-bg:     rgba(17, 20, 19, 0.90);
    --rig-fg:     #cfd6d2;
    --rig-dim:    #7f8a86;
    --rig-line:   rgba(159, 179, 168, 0.22);
    --rig-accent: #9fb3a8;

    --font-display: "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    /* Written by applyConfig() in JS — do not hand-edit */
    --panel-w: 420px;
    --panel-ar: 1.6;
    --fade-ms: 600ms;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg:    #1a1d1c;
      --page-fg:    #e4e6e5;
      --page-muted: #8d9694;
      --page-rule:  rgba(255, 255, 255, 0.13);
    }
  }

  :root[data-theme="dark"] {
    --page-bg:    #1a1d1c;
    --page-fg:    #e4e6e5;
    --page-muted: #8d9694;
    --page-rule:  rgba(255, 255, 255, 0.13);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--page-bg);
    color: var(--page-fg);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--rig-accent);
    outline-offset: 2px;
  }

  /* ================================================================
     Placeholder homepage — revealed under the intro
     ================================================================ */
  .page {
    min-height: 100dvh;
    display: grid;
    place-content: center;
    justify-items: start;
    gap: 22px;
    padding: 40px 28px;
    max-width: 620px;
    margin-inline: auto;
  }

  .page__mark {
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 400;
    letter-spacing: -0.022em;
    margin: 0;
  }

  .page__line {
    margin: 0;
    max-width: 42ch;
    font-size: 15px;
    line-height: 1.6;
    color: var(--page-muted);
  }

  .page__rule {
    width: 100%;
    height: 1px;
    background: var(--page-rule);
  }

  .page__nav {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    font-size: 14px;
  }

  .page__nav a {
    color: var(--page-fg);
    text-decoration: none;
    border-bottom: 1px solid var(--page-rule);
    padding-bottom: 2px;
    transition: border-color 160ms ease;
  }

  .page__nav a:hover { border-bottom-color: currentColor; }

  .page__note {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--page-muted);
  }

  /* ================================================================
     Intro overlay
     ================================================================ */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: var(--crt-void);
    opacity: 1;
    transition: opacity var(--fade-ms) cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Faint pool of light behind the panel — the room, not an effect */
  .intro::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse 60% 45% at 50% 50%,
      var(--crt-haze) 0%,
      var(--crt-void) 70%
    );
  }

  .intro.is-leaving { opacity: 0; }
  .intro.is-done { display: none; }

  /* Held for one frame on replay so nothing eases back to its start state */
  .intro.is-resetting,
  .intro.is-resetting * {
    transition: none !important;
  }

  .screen {
    position: relative;
    width: var(--panel-w);
    aspect-ratio: var(--panel-ar);
    background: var(--crt-screen);
    border: 1px solid var(--crt-frame);
    box-shadow:
      0 0 0 4px rgba(0, 0, 0, 0.28),
      0 0 44px -6px var(--crt-glow);
  }

  .screen__grid {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Corner falloff — CRT curvature without distorting anything */
  .screen__glass {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 26px -6px rgba(0, 0, 0, 0.65);
  }

  /* ================================================================
     Control rig — outside the experience, on purpose
     ================================================================ */
  .rig {
    position: fixed;
    z-index: 20;
    right: 16px;
    bottom: 16px;
    width: 268px;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-family: var(--font-mono);
    color: var(--rig-fg);
  }

  .rig__btn {
    appearance: none;
    width: 100%;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--rig-fg);
    background: var(--rig-bg);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid var(--rig-line);
    border-radius: 2px;
    padding: 9px 12px;
    cursor: pointer;
    transition: border-color 150ms ease, color 150ms ease;
  }

  .rig__btn:hover {
    border-color: var(--rig-accent);
    color: #fff;
  }

  .rig__panel {
    background: var(--rig-bg);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid var(--rig-line);
    border-radius: 2px;
  }

  .rig__panel > summary {
    list-style: none;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    padding: 9px 12px;
    color: var(--rig-dim);
    transition: color 150ms ease;
  }

  .rig__panel > summary::-webkit-details-marker { display: none; }
  .rig__panel > summary:hover { color: var(--rig-fg); }
  .rig__panel[open] > summary {
    color: var(--rig-fg);
    border-bottom: 1px solid var(--rig-line);
  }

  .rig__body {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 12px;
  }

  .knob {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 4px 8px;
  }

  .knob__label {
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--rig-dim);
  }

  .knob__value {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--rig-fg);
  }

  .knob input[type="range"] {
    grid-column: 1 / -1;
    width: 100%;
    margin: 0;
    height: 14px;
    accent-color: var(--rig-accent);
    cursor: pointer;
  }

  .knob input[type="text"] {
    grid-column: 1 / -1;
    font: inherit;
    font-size: 12px;
    color: var(--rig-fg);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--rig-line);
    border-radius: 2px;
    padding: 6px 8px;
    width: 100%;
  }

  .rig__total {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--rig-line);
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--rig-dim);
  }

  .rig__total b {
    font-weight: 400;
    text-transform: none;
    font-variant-numeric: tabular-nums;
    color: var(--rig-fg);
  }

  @media (max-width: 520px) {
    .rig { left: 12px; right: 12px; bottom: 12px; width: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .page__nav a { transition: none; }
  }
</style>

<main class="page">
  <h1 class="page__mark">Ben Genin</h1>
  <p class="page__line">
    Placeholder homepage. This block stands in for the real site so the
    intro has something to hand off to.
  </p>
  <div class="page__rule"></div>
  <nav class="page__nav">
    <a href="#work">Work</a>
    <a href="#writing">Writing</a>
    <a href="#contact">Contact</a>
  </nav>
  <p class="page__note">Prototype — intro only</p>
</main>

<div class="intro" id="intro" aria-hidden="true">
  <div class="screen">
    <canvas class="screen__grid" id="grid"></canvas>
    <div class="screen__glass"></div>
  </div>
</div>

<div class="rig">
  <button class="rig__btn" id="replay" type="button">Replay intro</button>
  <details class="rig__panel">
    <summary>Tuning</summary>
    <div class="rig__body" id="knobs">
      <!-- knobs are built from CONFIG below -->
      <div class="rig__total"><span>Total</span><b id="total">—</b></div>
    </div>
  </details>
</div>

<script>
(function () {
  "use strict";

  /* ==================================================================
     CONFIG — the only place you need to touch to retune the sequence.
     Every value is live-editable from the Tuning panel too; these are
     the defaults the page loads with.
     ================================================================== */
  const DEFAULTS = {
    greeting:        "Hi, I'm Ben",
    scrambleDuration: 1200, // ms of pure television snow before anything forms
    resolveDuration:  400,  // ms for the snow to settle into the words
    holdDuration:     800,  // ms holding the formed name
    fadeDuration:     600,  // ms for the whole intro to fade away
    panelWidth:       420,  // px wide (capped at 78vw on small screens)
    panelAspect:      1.60, // width : height — 1.6 is a wide, low rectangle
    cellSize:         7,    // px per chunky cell — bigger = blockier, less legible
  };

  /* Static rendering character — analog imperfection, not glitch. */
  const STATIC = {
    fps:        20,       // cell refresh rate; ~20 reads analog, 60 reads digital
    gutter:     1,        // px of dark gap between cells (the mosaic look)
    base:       "#0b0d0c",// what shows through the gutters
    // Warm bone ramp sampled from the reference panel, dark → bright.
    // Red leads green leads blue at every step — that is what keeps it
    // reading as bone rather than olive.
    ramp: ["#1b1a17", "#37352e", "#605c52", "#8f8a7e", "#bcb6a8", "#e9e4d7"],
    gammaMid:   0.98,     // >1 biases the snow dark, <1 biases it bright
    gammaSwing: 0.16,     // slow breathing of overall brightness
    bandDepth:  0.12,     // strength of the drifting horizontal bands
    // The name has to survive being drawn in cells. Below this many
    // columns it stops being readable, so on narrow screens the cells
    // shrink rather than the name breaking up.
    minCols:    54,
    // How long a single cell spends flickering between snow and its
    // final value, as a fraction of resolveDuration. Higher = softer settle.
    settleBand: 0.35,
    // Chance per frame that a settled cell twitches one step — the screen
    // stays alive under the name instead of freezing into a bitmap.
    residual:   0.05,
  };

  /* How the name is rasterised onto the cell grid. */
  const TEXT = {
    weight:     500,   // heavier strokes survive the downsample better
    tracking:   "0.06em", // letters need air at this resolution
    widthFrac:  0.84,  // fraction of panel width the name spans
    maxHeightFrac: 0.30, // ceiling on cap height, as a fraction of panel height
    gamma:      1.15,  // >1 darkens half-lit edge cells, keeping the letterforms crisp
  };

  const FONT_STACK = '"Helvetica Neue", Helvetica, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const SS = 4; // supersampling factor when rasterising the name

  /* ================================================================== */

  const cfg = Object.assign({}, DEFAULTS);

  const intro     = document.getElementById("intro");
  const canvas    = document.getElementById("grid");
  const ctx       = canvas.getContext("2d");
  const replayBtn = document.getElementById("replay");
  const totalOut  = document.getElementById("total");
  const knobHost  = document.getElementById("knobs");

  const off  = document.createElement("canvas");
  const octx = off.getContext("2d", { willReadFrequently: true });

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  let cols = 0, rows = 0, cellW = 0, cellH = 0, gutterPx = 1;
  let target = null;   // per-cell ramp index the name resolves to
  let settleAt = null; // per-cell moment (0..1) it stops being snow
  let rafId = null;
  let timers = [];
  let bandPhase = 0;

  /* ---------- Config → CSS custom properties ---------------------- */
  function applyConfig() {
    const root = document.documentElement.style;
    root.setProperty("--panel-w", "min(" + cfg.panelWidth + "px, 78vw)");
    root.setProperty("--panel-ar", String(cfg.panelAspect));
    root.setProperty("--fade-ms", cfg.fadeDuration + "ms");
    const total = cfg.scrambleDuration + cfg.resolveDuration +
                  cfg.holdDuration + cfg.fadeDuration;
    totalOut.textContent = (total / 1000).toFixed(2) + "s";
  }

  /* ---------- Grid geometry --------------------------------------- */
  function layout() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return false;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);

    // Cells stay square, and never grow so large that the name breaks up
    const cell = Math.min(cfg.cellSize, rect.width / STATIC.minCols);
    cols = Math.max(8, Math.round(rect.width / cell));
    rows = Math.max(5, Math.round(rect.height / cell));

    cellW = canvas.width / cols;
    cellH = canvas.height / rows;
    gutterPx = STATIC.gutter * dpr;
    return true;
  }

  /* ---------- Rasterise the name onto the cell grid ---------------- */
  function buildTarget() {
    const w = cols * SS, h = rows * SS;
    off.width = w;
    off.height = h;

    octx.clearRect(0, 0, w, h);
    octx.fillStyle = "#fff";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    if ("letterSpacing" in octx) octx.letterSpacing = TEXT.tracking;

    // Size the type to span widthFrac of the panel, then cap its height
    const text = cfg.greeting;
    let size = h * 0.5;
    octx.font = TEXT.weight + " " + size + "px " + FONT_STACK;
    const measured = octx.measureText(text).width || 1;
    size = Math.min(size * ((w * TEXT.widthFrac) / measured),
                    h * TEXT.maxHeightFrac / 0.72);
    octx.font = TEXT.weight + " " + size + "px " + FONT_STACK;
    octx.fillText(text, w / 2, h / 2);

    // Average each SS×SS block into one cell's coverage, so edge cells
    // land on mid-ramp tones instead of hard-clipping to on/off
    const data = octx.getImageData(0, 0, w, h).data;
    const levels = STATIC.ramp.length;
    target = new Uint8Array(cols * rows);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let sum = 0;
        for (let j = 0; j < SS; j++) {
          const row = (y * SS + j) * w;
          for (let i = 0; i < SS; i++) {
            sum += data[((row + x * SS + i) << 2) + 3];
          }
        }
        const cov = sum / (SS * SS * 255);
        target[y * cols + x] = Math.min(
          levels - 1,
          Math.round(Math.pow(cov, TEXT.gamma) * (levels - 1))
        );
      }
    }
  }

  /* Each cell gets its own moment to stop scrambling, so the name
     precipitates out of the snow rather than cutting in. */
  function seedSettle() {
    settleAt = new Float32Array(cols * rows);
    const span = 1 - STATIC.settleBand;
    for (let i = 0; i < settleAt.length; i++) {
      settleAt[i] = Math.random() * span;
    }
  }

  /* ---------- One frame -------------------------------------------
     progress < 0  → pure snow
     0 … 1         → cells settling onto the name
     progress >= 1 → name held, with a little residual life
     ---------------------------------------------------------------- */
  function draw(t, progress) {
    const w = canvas.width, h = canvas.height;
    if (!w || !h) return;

    ctx.fillStyle = STATIC.base;
    ctx.fillRect(0, 0, w, h);

    const levels = STATIC.ramp.length;
    const band = STATIC.settleBand;

    // Overall brightness breathes slowly, with a little frame-to-frame drift
    const gamma =
      STATIC.gammaMid +
      STATIC.gammaSwing * Math.sin(t * 0.0027) +
      (Math.random() - 0.5) * 0.05;

    bandPhase += 0.06;

    for (let y = 0; y < rows; y++) {
      // Soft horizontal banding drifting down the panel
      const rowGamma = gamma * (1 + STATIC.bandDepth * Math.sin(y * 0.9 + bandPhase));
      const py = Math.round(y * cellH);
      const rh = Math.max(1, Math.round(cellH - gutterPx));

      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        let idx;

        // How far this particular cell is through its own settle
        const local = progress < 0 ? -1 : (progress - settleAt[i]) / band;

        if (local >= 1) {
          idx = target[i];
          // Residual twitch keeps the screen alive under the name
          if (Math.random() < STATIC.residual) {
            idx = Math.max(0, Math.min(levels - 1, idx + (Math.random() < 0.5 ? -1 : 1)));
          }
        } else if (local > 0 && Math.random() < local) {
          idx = target[i];
        } else {
          idx = Math.floor(Math.pow(Math.random(), rowGamma) * levels);
          if (idx >= levels) idx = levels - 1;
        }

        ctx.fillStyle = STATIC.ramp[idx];
        ctx.fillRect(
          Math.round(x * cellW), py,
          Math.max(1, Math.round(cellW - gutterPx)), rh
        );
      }
    }
  }

  /* ---------- Sequence -------------------------------------------- */
  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function leave() {
    intro.classList.add("is-leaving");
    at(cfg.fadeDuration, () => {
      clearTimers();
      intro.classList.add("is-done");
    });
  }

  function play() {
    clearTimers();

    // Snap back to the opening state without animating the rewind
    intro.classList.add("is-resetting");
    intro.classList.remove("is-done", "is-leaving");
    void intro.offsetWidth;
    intro.classList.remove("is-resetting");

    applyConfig();
    if (!layout()) return;
    buildTarget();
    seedSettle();

    if (reduced.matches) {
      // No flicker: the name is simply already there.
      draw(performance.now(), 1);
      at(cfg.holdDuration, leave);
      return;
    }

    const started = performance.now();
    const interval = 1000 / STATIC.fps;
    const scramble = cfg.scrambleDuration;
    const resolve = Math.max(1, cfg.resolveDuration);
    const until = scramble + resolve + cfg.holdDuration;
    let last = -Infinity;

    function frame(now) {
      const elapsed = now - started;

      if (now - last >= interval) {
        const progress = elapsed < scramble ? -1 : (elapsed - scramble) / resolve;
        draw(now, Math.min(progress, 1));
        last = now;
      }

      if (elapsed >= until) { rafId = null; leave(); return; }
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
  }

  /* ---------- Tuning knobs ---------------------------------------- */
  const KNOBS = [
    { key: "greeting",         label: "Name",     type: "text" },
    { key: "scrambleDuration", label: "Scramble", min: 0,   max: 3000, step: 50,   unit: "ms" },
    { key: "resolveDuration",  label: "Resolve",  min: 50,  max: 2000, step: 25,   unit: "ms" },
    { key: "holdDuration",     label: "Hold",     min: 100, max: 3000, step: 50,   unit: "ms" },
    { key: "fadeDuration",     label: "Fade out", min: 100, max: 2000, step: 50,   unit: "ms" },
    { key: "panelWidth",       label: "Width",    min: 220, max: 760,  step: 10,   unit: "px" },
    { key: "panelAspect",      label: "Aspect",   min: 1,   max: 2.8,  step: 0.05, unit: ":1" },
    { key: "cellSize",         label: "Cell size",min: 3,   max: 20,   step: 1,    unit: "px" },
  ];

  const totalRow = knobHost.firstElementChild;

  KNOBS.forEach(function (k) {
    const wrap = document.createElement("label");
    wrap.className = "knob";

    const name = document.createElement("span");
    name.className = "knob__label";
    name.textContent = k.label;

    const out = document.createElement("span");
    out.className = "knob__value";

    const input = document.createElement("input");

    if (k.type === "text") {
      input.type = "text";
      input.value = cfg[k.key];
      input.addEventListener("input", function () {
        cfg[k.key] = input.value;
        if (layout()) { buildTarget(); }
      });
      wrap.append(name, out, input);
    } else {
      input.type = "range";
      input.min = k.min; input.max = k.max; input.step = k.step;
      input.value = cfg[k.key];

      const render = function () {
        const v = cfg[k.key];
        out.textContent = (k.step < 1 ? v.toFixed(2) : v) + k.unit;
      };

      input.addEventListener("input", function () {
        cfg[k.key] = parseFloat(input.value);
        render();
        applyConfig();
        if (layout()) { buildTarget(); seedSettle(); }
      });

      render();
      wrap.append(name, out, input);
    }

    knobHost.insertBefore(wrap, totalRow);
  });

  /* ---------- Wiring ---------------------------------------------- */
  replayBtn.addEventListener("click", play);

  window.addEventListener("resize", function () {
    applyConfig();
    if (layout()) { buildTarget(); }
  });

  applyConfig();
  play();
})();
</script>
